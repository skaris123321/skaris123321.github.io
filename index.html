<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>РОСЭК — Шкафы АВР, ВРУ, ГРЩ и ИБП</title>
  <meta name="description" content="Производство и продажа шкафов автоматического ввода резерва, вводных устройств, главных распределительных щитов и систем бесперебойного питания">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    if (typeof window.solveSimpleChallenge === 'undefined') {
      window.solveSimpleChallenge = () => null;
    }
  </script>

  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-light text-dark">
  <header class="header">
    <div class="container flex-wrap justify-between items-center">
      <a href="index.html" class="logo">РОСЭК</a>

      <div class="header-controls">
        <div class="search-wrapper">
          <input type="search" placeholder="Поиск по товарам..." class="search-input" id="searchInput">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" class="btn-catalog">
            Каталог
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <div x-show="open" @click.away="open = false" class="dropdown-menu" x-transition>
            <a href="category/avr.html" class="dropdown-item">АВР</a>
            <a href="#" class="dropdown-item">ВРУ</a>
            <a href="#" class="dropdown-item">ГРЩ</a>
            <a href="#" class="dropdown-item">ИБП</a>
            <a href="#" class="dropdown-item">Шкафы управления</a>
            <a href="#" class="dropdown-item">Стабилизаторы напряжения</a>
          </div>
        </div>
      </div>

      <div class="contact-group">
        <a href="category/cart.html" class="cart-link" x-data="{ cartCount: 0 }" x-init="
          cartCount = window.cart ? window.cart.getTotalItems() : 0;
          window.addEventListener('cartChanged', (e) => cartCount = e.detail.totalItems);
        ">
          <div class="cart-icon-wrapper">
            <svg class="cart-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6M7 13l-1.5-6m0 0h15M17 21a2 2 0 100-4 2 2 0 000 4zM9 21a2 2 0 100-4 2 2 0 000 4z"/>
            </svg>
            <span x-show="cartCount > 0" x-text="cartCount" class="cart-badge"></span>
          </div>
          <span class="cart-text">Корзина</span>
        </a>
        <a href="tel:+780055118939" class="phone hidden sm:block">8 (800) 511-89-39</a>
        <a href="mailto:zakaz@rosek.tech" class="email hidden md:block">zakaz@rosek.tech</a>
        <button class="btn-login">Войти</button>
      </div>
    </div>
  </header>

  <main class="container py-12 md:py-16">
    <h1 class="page-title">Каталог шкафов АВР</h1>

    <div class="grid-catalog">
      <a href="category/avr.html" class="product-card">
        <div class="product-image-wrapper">
          <img src="images/avr-100.jpg" alt="Шкафы АВР" class="product-image">
        </div>
        <div class="product-info">
          <h2 class="product-title">Шкафы АВР</h2>
          <p class="product-description">Автоматический ввод резерва различных номиналов</p>
          <p class="product-price">от 38 000 ₽</p>
          <p class="product-delivery">Под заказ от 12 дней</p>
        </div>
      </a>
    </div>
  </main>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Простая функциональность поиска для главной страницы
    document.addEventListener('DOMContentLoaded', function() {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            const query = this.value.trim();
            if (query) {
              // Перенаправляем на страницу каталога с поисковым запросом
              window.location.href = `category/avr.html?search=${encodeURIComponent(query)}`;
            }
          }
        });
      }
    });
  </script>
</body>
</html>
