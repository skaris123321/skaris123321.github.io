<!DOCTYPE html>
<html>
<head><title>Тест API</title></head>
<body>
<div id="result"></div>
<script src="js/main.js"></script>
<script>
async function test() {
    try {
        const data = await productsAPI.getAvailableOptions({
            manufacturer_brand: 'CHINT',
            commutation_type: 'single_phase_contactors'
        });
        
        document.getElementById('result').innerHTML = `
            <h2>Результат:</h2>
            <p>Успех: ${data.success}</p>
            <p>Корпуса: ${JSON.stringify(data.available_options.enclosure_type)}</p>
            <p>Подключения: ${JSON.stringify(data.available_options.connection_type)}</p>
            <p>Климат: ${JSON.stringify(data.available_options.climate_type)}</p>
        `;
    } catch (e) {
        document.getElementById('result').innerHTML = `Ошибка: ${e.message}`;
    }
}
window.onload = test;
</script>
</body>
</html>
