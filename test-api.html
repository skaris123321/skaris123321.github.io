<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест API документов</title>
</head>
<body>
    <h1>Тест API документов</h1>
    <button onclick="testAPI()">Тестировать API для 25А</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            try {
                const response = await fetch('api/get_documents.php?' + new URLSearchParams({
                    switching_type: 'monoblock-avr',
                    inputs: '2',
                    current: '25',
                    manufacturer: 'CHINT'
                }));
                
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = 'Ошибка: ' + error.message;
            }
        }
    </script>
</body>
</html>
