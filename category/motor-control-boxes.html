<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ящики управления электродвигателями Я5000 — РОСЭК</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    if (typeof window.solveSimpleChallenge === 'undefined') {
      window.solveSimpleChallenge = () => null;
    }
  </script>

  <link rel="stylesheet" href="../css/main.css?v=32">
  <script src="../js/load-components.js"></script>
</head>
<body class="bg-light text-dark">
  <div id="header-placeholder"></div>

  <section class="section">
    <div class="container">
      <div class="breadcrumbs">
        <a href="../index.html">Главная</a>
        <span>»</span>
        <a href="catalog.html">Каталог</a>
        <span>»</span>
        <span>Ящики управления электродвигателями Я5000</span>
      </div>

      <h1 class="category-title">
        Ящики управления электродвигателями Я5000
      </h1>
    </div>
  </section>

  <div x-data="motorControlBoxesPage()" x-init="init()">
  <section class="sort-section">
    <div class="container sort-controls">
      <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; width: 100%;">
        <!-- Бренды -->
        <div style="min-width: 300px;">
          <span style="font-weight: 500; color: #6b7280; font-size: 0.875rem; display: block; margin-bottom: 0.5rem;">Бренды</span>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <template x-for="brand in availableBrands" :key="brand">
              <button 
                @click="selectedBrand = (selectedBrand === brand ? '' : brand); filterProducts()"
                :class="{ active: selectedBrand === brand }"
                class="brand-filter-btn"
                x-text="brand"
              ></button>
            </template>
          </div>
        </div>
        
        <!-- Сортировка -->
        <div style="display: flex; gap: 0.5rem; margin-left: auto; align-self: flex-end;">
          <button 
            @click="sortBy = 'price_asc'; filterProducts()"
            :class="{ active: sortBy === 'price_asc' }"
            class="sort-btn"
          >
            По цене ↑
          </button>
          <button 
            @click="sortBy = 'price_desc'; filterProducts()"
            :class="{ active: sortBy === 'price_desc' }"
            class="sort-btn"
          >
            По цене ↓
          </button>
        </div>
      </div>
    </div>
  </section>

  <main class="container" style="padding: 3rem 0;">
    <div x-show="loading" style="text-align: center; padding: 3rem;">
      <p style="color: #6b7280;">Загрузка товаров...</p>
    </div>
    
    <div x-show="!loading && filteredProducts.length === 0" style="text-align: center; padding: 3rem;">
      <p style="color: #6b7280;">Товары не найдены</p>
    </div>

    <div class="products-grid" x-show="!loading && filteredProducts.length > 0">
      <template x-for="product in filteredProducts" :key="product.id">
        <a :href="'product.html?id=' + product.id" class="product-card" style="text-decoration: none; color: inherit;">
          <div class="product-image-wrapper">
            <img x-show="product.main_image && product.main_image !== ''" :src="'../' + product.main_image" :alt="product.description" class="product-image">
            <div x-show="!product.main_image || product.main_image === ''" class="no-image-placeholder">
              <p>Нет изображения</p>
            </div>
          </div>
          <div class="product-info">
            <h2 class="product-title" x-text="product.article"></h2>
            <p class="product-description" x-text="product.description"></p>
            <p class="product-price" x-text="formatPrice(product.base_price)"></p>
            <p class="product-delivery">Под заказ от 12 дней</p>
          </div>
        </a>
      </template>
    </div>
  </main>
  </div>

  <div id="footer-placeholder"></div>

  <script src="../js/cart.js"></script>
  <script src="../js/products-api.js?v=2"></script>
  <script src="../js/motor-control-boxes-page.js?v=2"></script>
  <script src="../js/search.js"></script>

</body>
</html>
