<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — РОСЭК</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    if (typeof window.solveSimpleChallenge === 'undefined') {
      window.solveSimpleChallenge = () => null;
    }
  </script>

  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-light text-dark">
  <header class="header">
    <div class="container flex-wrap justify-between items-center">
      <a href="../index.html" class="logo">РОСЭК</a>

      <div class="header-controls">
        <div class="search-wrapper">
          <input type="search" placeholder="Поиск по товарам..." class="search-input">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" class="btn-catalog">
            Каталог
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <div x-show="open" @click.away="open = false" class="dropdown-menu" x-transition>
            <a href="avr.html" class="dropdown-item">АВР</a>
            <a href="#" class="dropdown-item">ВРУ</a>
            <a href="#" class="dropdown-item">ГРЩ</a>
            <a href="#" class="dropdown-item">ИБП</a>
            <a href="#" class="dropdown-item">Шкафы управления</a>
            <a href="#" class="dropdown-item">Стабилизаторы напряжения</a>
          </div>
        </div>
      </div>

      <div class="contact-group">
        <a href="cart.html" class="relative inline-flex items-center p-2 text-gray-600 hover:text-blue-600 mr-4" x-data="{ cartCount: 0 }" x-init="
          cartCount = window.cart ? window.cart.getTotalItems() : 0;
          window.addEventListener('cartChanged', (e) => cartCount = e.detail.totalItems);
        ">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6M7 13l-1.5-6m0 0h15M17 21a2 2 0 100-4 2 2 0 000 4zM9 21a2 2 0 100-4 2 2 0 000 4z"/>
          </svg>
          <span x-show="cartCount > 0" x-text="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center"></span>
        </a>
        <a href="tel:+780055118939" class="phone hidden sm:block">8 (800) 511-89-39</a>
        <a href="mailto:zakaz@rosek.tech" class="email hidden md:block">zakaz@rosek.tech</a>
        <button class="btn-login">Войти</button>
      </div>
    </div>
  </header>

  <div x-data="cartData()" x-init="init()">
    <section class="section">
      <div class="container">
        <div class="breadcrumbs">
          <a href="../index.html">Главная</a>
          <span>»</span>
          <span class="breadcrumbs-current">Корзина</span>
        </div>
        <h1 class="category-title">Корзина</h1>
      </div>
    </section>

    <main class="container" style="min-height: 60vh;">
      <!-- Пустая корзина -->
      <div x-show="items.length === 0" class="text-center py-16">
        <svg class="w-24 h-24 mx-auto mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6M7 13l-1.5-6m0 0h15M17 21a2 2 0 100-4 2 2 0 000 4zM9 21a2 2 0 100-4 2 2 0 000 4z"/>
        </svg>
        <h2 class="text-2xl font-semibold mb-2">Корзина пуста</h2>
        <p class="text-gray-600 mb-6">Добавьте товары в корзину, чтобы оформить заказ</p>
        <a href="avr.html" class="btn-add-to-cart inline-block">Перейти к каталогу</a>
      </div>

      <!-- Товары в корзине -->
      <div x-show="items.length > 0">
        <div class="grid gap-6">
          <template x-for="item in items" :key="item.id">
            <div class="bg-white rounded-lg border border-gray-200 p-6">
              <div class="flex flex-col lg:flex-row gap-6">
                <!-- Изображение товара -->
                <div class="flex-shrink-0">
                  <img :src="item.images?.[0] || '../images/avr-100.jpg'" :alt="item.productTitle" class="w-32 h-32 object-cover rounded-lg">
                </div>

                <!-- Информация о товаре -->
                <div class="flex-grow">
                  <h3 class="text-xl font-semibold mb-2" x-text="item.productTitle"></h3>
                  <p class="text-gray-600 mb-2" x-text="'Артикул: ' + item.article"></p>
                  
                  <div class="grid grid-cols-2 gap-4 text-sm text-gray-600 mb-4">
                    <div>Производитель: <span x-text="item.manufacturerBrand"></span></div>
                    <div>Тип коммутации: <span x-text="item.commutationType === 'monoblock' ? 'Моноблочный АВР' : 'Контакторы'"></span></div>
                    <div>Количество вводов: <span x-text="item.inputsCount"></span></div>
                    <div>Подключение: <span x-text="item.cableConnection === 'poles' ? 'К полюсам автомата' : 'На дополнительные клеммы'"></span></div>
                  </div>

                  <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                      <!-- Количество -->
                      <div class="flex items-center border border-gray-300 rounded">
                        <button @click="updateQuantity(item.id, item.quantity - 1)" class="px-3 py-1 hover:bg-gray-100">-</button>
                        <span class="px-3 py-1 border-x border-gray-300" x-text="item.quantity"></span>
                        <button @click="updateQuantity(item.id, item.quantity + 1)" class="px-3 py-1 hover:bg-gray-100">+</button>
                      </div>
                      
                      <!-- Кнопка удаления -->
                      <button @click="removeItem(item.id)" class="text-red-600 hover:text-red-800">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                      </button>
                    </div>

                    <!-- Цена -->
                    <div class="text-right">
                      <div class="text-lg font-semibold" x-text="formatPrice(item.totalPrice * item.quantity)"></div>
                      <div class="text-sm text-gray-600" x-text="formatPrice(item.totalPrice) + ' за шт.'"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Итого -->
        <div class="bg-white rounded-lg border border-gray-200 p-6 mt-6">
          <div class="flex justify-between items-center text-xl font-semibold">
            <span>Итого:</span>
            <span x-text="formatPrice(totalPrice)"></span>
          </div>
          <div class="text-gray-600 mt-2">
            <span x-text="'Товаров: ' + totalItems + ' шт.'"></span>
          </div>
          
          <div class="flex gap-4 mt-6">
            <button @click="clearCart()" class="px-6 py-2 border border-gray-300 rounded hover:bg-gray-50">
              Очистить корзину
            </button>
            <button class="btn-add-to-cart flex-grow">
              Оформить заказ
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/cart.js"></script>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('cartData', () => {
        return {
          items: [],
          totalItems: 0,
          totalPrice: 0,

          init() {
            this.loadCart();
            
            // Слушаем изменения корзины
            window.addEventListener('cartChanged', (event) => {
              this.items = event.detail.items;
              this.totalItems = event.detail.totalItems;
              this.totalPrice = event.detail.totalPrice;
            });
          },

          loadCart() {
            if (window.cart) {
              this.items = window.cart.getItems();
              this.totalItems = window.cart.getTotalItems();
              this.totalPrice = window.cart.getTotalPrice();
            }
          },

          updateQuantity(itemId, quantity) {
            if (window.cart) {
              window.cart.updateQuantity(itemId, quantity);
            }
          },

          removeItem(itemId) {
            if (window.cart && confirm('Удалить товар из корзины?')) {
              window.cart.removeItem(itemId);
            }
          },

          clearCart() {
            if (window.cart && confirm('Очистить корзину?')) {
              window.cart.clear();
            }
          },

          formatPrice(price) {
            return new Intl.NumberFormat('ru-RU').format(price) + ' ₽';
          }
        };
      });
    });
  </script>
</body>
</html>
