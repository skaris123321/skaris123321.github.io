<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — РОСЭК</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    if (typeof window.solveSimpleChallenge === 'undefined') {
      window.solveSimpleChallenge = () => null;
    }
  </script>

  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-light text-dark">
  <header class="header">
    <div class="container flex-wrap justify-between items-center">
      <a href="../index.html" class="logo">РОСЭК</a>

      <div class="header-controls">
        <div class="search-wrapper">
          <input type="search" placeholder="Поиск по товарам..." class="search-input">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" class="btn-catalog">
            Каталог
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <div x-show="open" @click.away="open = false" class="dropdown-menu" x-transition>
            <a href="avr.html" class="dropdown-item">АВР</a>
            <a href="#" class="dropdown-item">ВРУ</a>
            <a href="#" class="dropdown-item">ГРЩ</a>
            <a href="#" class="dropdown-item">ИБП</a>
            <a href="#" class="dropdown-item">Шкафы управления</a>
            <a href="#" class="dropdown-item">Стабилизаторы напряжения</a>
          </div>
        </div>
      </div>

      <div class="contact-group">
        <a href="cart.html" class="cart-link" x-data="{ cartCount: 0 }" x-init="
          cartCount = window.cart ? window.cart.getTotalItems() : 0;
          window.addEventListener('cartChanged', (e) => cartCount = e.detail.totalItems);
        ">
          <div class="cart-icon-wrapper">
            <svg class="cart-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6M7 13l-1.5-6m0 0h15M17 21a2 2 0 100-4 2 2 0 000 4zM9 21a2 2 0 100-4 2 2 0 000 4z"/>
            </svg>
            <span x-show="cartCount > 0" x-text="cartCount" class="cart-badge"></span>
          </div>
          <span class="cart-text">Корзина</span>
        </a>
        <a href="tel:+780055118939" class="phone hidden sm:block">8 (800) 511-89-39</a>
        <a href="mailto:zakaz@rosek.tech" class="email hidden md:block">zakaz@rosek.tech</a>
        <button class="btn-login">Войти</button>
      </div>
    </div>
  </header>

  <div x-data="cartData()" x-init="init()">
    <section class="section">
      <div class="container">
        <div class="breadcrumbs">
          <a href="../index.html">Главная</a>
          <span>»</span>
          <span class="breadcrumbs-current">Корзина</span>
        </div>
        <h1 class="category-title">Корзина</h1>
      </div>
    </section>

    <main class="container" style="min-height: 60vh;">
      <!-- Пустая корзина -->
      <div x-show="items.length === 0" class="empty-cart">
        <svg class="empty-cart-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6M7 13l-1.5-6m0 0h15M17 21a2 2 0 100-4 2 2 0 000 4zM9 21a2 2 0 100-4 2 2 0 000 4z"/>
        </svg>
        <h2 class="empty-cart-title">Корзина пуста</h2>
        <p class="empty-cart-text">Добавьте товары в корзину, чтобы оформить заказ</p>
        <a href="avr.html" class="btn-add-to-cart">Перейти к каталогу</a>
      </div>

      <!-- Товары в корзине -->
      <div x-show="items.length > 0">
        <div class="cart-items">
          <template x-for="item in items" :key="item.id">
            <div class="cart-item">
              <div class="cart-item-content">
                <!-- Изображение товара -->
                <div class="cart-item-image">
                  <img :src="item.images?.[0] || '../images/avr-100.jpg'" :alt="item.productTitle">
                </div>

                <!-- Информация о товаре -->
                <div class="cart-item-info">
                  <h3 class="cart-item-title" x-text="item.productTitle"></h3>
                  <p class="cart-item-article" x-text="'Артикул: ' + item.article"></p>
                  
                  <div class="cart-item-specs">
                    <div class="cart-item-spec">
                      <span>Производитель:</span>
                      <span class="cart-item-spec-value" x-text="item.manufacturerBrand"></span>
                    </div>
                    <div class="cart-item-spec">
                      <span>Тип коммутации:</span>
                      <span class="cart-item-spec-value" x-text="item.commutationType === 'monoblock' ? 'Моноблочный АВР' : 'Контакторы'"></span>
                    </div>
                    <div class="cart-item-spec">
                      <span>Количество вводов:</span>
                      <span class="cart-item-spec-value" x-text="item.inputsCount"></span>
                    </div>
                    <div class="cart-item-spec">
                      <span>Подключение кабеля:</span>
                      <span class="cart-item-spec-value" x-text="item.cableConnection === 'poles' ? 'К полюсам автомата' : 'На дополнительные клеммы'"></span>
                    </div>
                    <div class="cart-item-spec">
                      <span>Климатическое исполнение:</span>
                      <span class="cart-item-spec-value" x-text="item.climateVersion === 'UXL4' ? 'УХЛ4 - сухие теплые помещения' : 'У2 - уличное с обогревом'"></span>
                    </div>
                  </div>

                  <div class="cart-item-actions">
                    <div class="cart-quantity-controls">
                      <!-- Количество -->
                      <div class="quantity-input">
                        <button @click="updateQuantity(item.id, item.quantity - 1)" class="quantity-btn" :disabled="item.quantity <= 1">−</button>
                        <input 
                          type="number" 
                          :value="item.quantity" 
                          @input="updateQuantity(item.id, parseInt($event.target.value) || 1)"
                          @blur="if (!$event.target.value || $event.target.value < 1) updateQuantity(item.id, 1)"
                          class="quantity-value-input"
                          min="1"
                          max="999"
                        >
                        <button @click="updateQuantity(item.id, item.quantity + 1)" class="quantity-btn">+</button>
                      </div>
                      
                      <!-- Кнопка удаления -->
                      <button @click="confirmRemoveItem(item)" class="remove-btn">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                        Удалить
                      </button>
                    </div>

                    <!-- Цена -->
                    <div class="cart-item-price">
                      <div class="cart-item-total" x-text="formatPrice(item.totalPrice * item.quantity)"></div>
                      <div class="cart-item-unit-price" x-text="formatPrice(item.totalPrice) + ' за шт.'"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Итого -->
        <div class="cart-summary">
          <div class="cart-summary-row">
            <span class="cart-summary-items" x-text="'Товаров: ' + totalItems + ' шт.'"></span>
          </div>
          <div class="cart-summary-row cart-summary-total">
            <span>Итого:</span>
            <span x-text="formatPrice(totalPrice)"></span>
          </div>
          
          <div class="cart-actions">
            <button @click="confirmClearCart()" class="btn-clear-cart">
              Очистить корзину
            </button>
            <button class="btn-checkout">
              Оформить заказ
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/cart.js"></script>
  <script>
    // Глобальная ссылка на данные корзины для использования в модальных окнах
    window.cartData = null;
    
    document.addEventListener('alpine:init', () => {
      Alpine.data('cartData', () => {
        const data = {
          items: [],
          totalItems: 0,
          totalPrice: 0,

          init() {
            this.loadCart();
            
            // Слушаем изменения корзины
            window.addEventListener('cartChanged', (event) => {
              this.items = event.detail.items;
              this.totalItems = event.detail.totalItems;
              this.totalPrice = event.detail.totalPrice;
            });
          },

          loadCart() {
            if (window.cart) {
              this.items = window.cart.getItems();
              this.totalItems = window.cart.getTotalItems();
              this.totalPrice = window.cart.getTotalPrice();
            }
          },

          updateQuantity(itemId, quantity) {
            if (window.cart) {
              // Убеждаемся что количество корректное
              const validQuantity = Math.max(1, Math.min(999, parseInt(quantity) || 1));
              window.cart.updateQuantity(itemId, validQuantity);
            }
          },

          removeItem(itemId) {
            if (window.cart) {
              window.cart.removeItem(itemId);
            }
          },

          confirmRemoveItem(item) {
            this.showModal({
              type: 'warning',
              title: 'Удалить товар?',
              message: `Вы уверены, что хотите удалить "${item.productTitle}" из корзины?`,
              confirmText: 'Удалить',
              onConfirm: () => this.removeItem(item.id)
            });
          },

          clearCart() {
            if (window.cart) {
              window.cart.clear();
            }
          },

          confirmClearCart() {
            this.showModal({
              type: 'warning',
              title: 'Очистить корзину?',
              message: 'Вы уверены, что хотите удалить все товары из корзины? Это действие нельзя отменить.',
              confirmText: 'Очистить корзину',
              onConfirm: () => this.clearCart()
            });
          },

          // Универсальная система модальных окон (копия из main.js)
          showModal(options) {
            const {
              type = 'info',
              title = 'Подтверждение',
              message = '',
              showCancel = true,
              confirmText = 'Подтвердить',
              cancelText = 'Отмена',
              onConfirm = null,
              onCancel = null
            } = options;

            // Удаляем предыдущие модальные окна
            const existingModals = document.querySelectorAll('.universal-modal');
            existingModals.forEach(modal => modal.remove());

            // Создаем модальное окно
            const modal = document.createElement('div');
            modal.className = 'universal-modal modal-overlay show';
            
            const iconSvg = type === 'success' ? 
              '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' :
              type === 'warning' ?
              '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>' :
              '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

            modal.innerHTML = `
              <div class="modal-content">
                <div class="modal-header">
                  <div class="modal-icon modal-icon-${type}">
                    ${iconSvg}
                  </div>
                  <h3 class="modal-title">${title}</h3>
                </div>
                <div class="modal-message">${message}</div>
                <div class="modal-actions">
                  ${showCancel ? `<button class="modal-btn modal-btn-cancel">${cancelText}</button>` : ''}
                  <button class="modal-btn modal-btn-confirm">${confirmText}</button>
                </div>
              </div>
            `;

            // Добавляем обработчики событий
            const cancelBtn = modal.querySelector('.modal-btn-cancel');
            const confirmBtn = modal.querySelector('.modal-btn-confirm');

            if (cancelBtn) {
              cancelBtn.addEventListener('click', () => {
                modal.remove();
                if (onCancel && typeof onCancel === 'function') {
                  onCancel();
                }
              });
            }

            if (confirmBtn) {
              confirmBtn.addEventListener('click', () => {
                modal.remove();
                if (onConfirm && typeof onConfirm === 'function') {
                  onConfirm();
                }
              });
            }

            // Закрытие по клику вне окна
            modal.addEventListener('click', (e) => {
              if (e.target === modal) {
                modal.remove();
                if (onCancel && typeof onCancel === 'function') {
                  onCancel();
                }
              }
            });

            // Добавляем в body
            document.body.appendChild(modal);

            // Автоматически закрываем уведомления (не подтверждения) через 3 секунды
            if (!showCancel) {
              setTimeout(() => {
                if (modal.parentNode) {
                  modal.remove();
                }
              }, 3000);
            }
          },

          formatPrice(price) {
            return new Intl.NumberFormat('ru-RU').format(price) + ' ₽';
          }
        };
        
        // Сохраняем глобальную ссылку для использования в модальных окнах
        window.cartData = data;
        return data;
      });
    });
  </script>
</body>
</html>
