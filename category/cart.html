<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    if (typeof window.solveSimpleChallenge === 'undefined') {

<body class="bg-light text-dark">
  <header class="header">
    <div class="container flex-wrap justify-between items-center">
      <a href="../index.html" class="logo">
        <img src="../images/logo-main-1.svg" alt="РОСЭК" class="logo-image">
      </a>

      <div class="header-controls">
        <div class="search-wrapper">
          <input type="search" placeholder="Поиск по товарам..." class="search-input">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <div class="relative" x-data="{ open: false }">
          <a href="catalog.html" class="btn-catalog">
            Каталог
          </a>
        </div>
      </div>

      <div class="contact-group">
        <a href="cart.html" class="cart-link" x-data="{ cartCount: 0 }" x-init="
          cartCount = window.cart ? window.cart.getTotalItems() : 0;
          window.addEventListener('cartChanged', (e) => cartCount = e.detail.totalItems);
        ">
          <div class="cart-icon-wrapper">
            <svg class="cart-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6M7 13l-1.5-6m0 0h15M17 21a2 2 0 100-4 2 2 0 000 4zM9 21a2 2 0 100-4 2 2 0 000 4z"/>
            </svg>
            <span x-show="cartCount > 0" x-text="cartCount" class="cart-badge"></span>
          </div>
          <span class="cart-text">Корзина</span>
        </a>
        <a href="tel:+78005511052" class="phone hidden sm:block">8 (800) 55-11-052</a>
        <a href="mailto:zakaz@rosek.tech" class="email hidden md:block">zakaz@rosek.tech</a>
        <button class="btn-login">Войти</button>
      </div>
    </div>
  </header>

  <div x-data="cartData()" x-init="init()">
    <section class="section">
      <div class="container">
        <div class="breadcrumbs">
          <a href="../index.html">Главная</a>
          <span>»</span>
          <a href="catalog.html">Каталог</a>
          <span>»</span>
          <span class="breadcrumbs-current">Корзина</span>
        </div>
        <h1 class="category-title">Корзина</h1>
      </div>
    </section>

    <main class="container cart-page-container" style="min-height: 60vh; padding-top: 2rem; padding-bottom: 3rem;">
      <!-- Пустая корзина -->
      <div x-show="items.length === 0" class="empty-cart">
        <svg class="empty-cart-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6M7 13l-1.5-6m0 0h15M17 21a2 2 0 100-4 2 2 0 000 4zM9 21a2 2 0 100-4 2 2 0 000 4z"/>
        </svg>
        <h2 class="empty-cart-title">Корзина пуста</h2>
        <p class="empty-cart-text">Добавьте товары в корзину, чтобы оформить заказ</p>
        <a href="catalog.html" class="btn-add-to-cart">Перейти к каталогу</a>
      </div>

      <!-- Товары в корзине -->
      <div x-show="items.length > 0">
        <div class="cart-items">
          <template x-for="item in items" :key="item.id">
            <div class="cart-item">
              <div class="cart-item-content">
                <!-- Изображение товара -->
                <div class="cart-item-image">
                  <img :src="item.images?.[0] || '../images/avr-100.jpg'" :alt="item.productTitle">
                </div>

                <!-- Информация о товаре -->
                <div class="cart-item-info">
                  <h3 class="cart-item-title" x-text="item.productTitle"></h3>
                  <p class="cart-item-article" x-text="'Артикул: ' + item.article"></p>
                  
                  <div class="cart-item-specs">
                    <div class="cart-item-spec">
                      <span>Производитель:</span>
                      <span class="cart-item-spec-value" x-text="item.manufacturerBrand"></span>
                    </div>
                    
                    <!-- Характеристики для шкафов управления -->
                    <template x-if="item.commutationType === 'control_cabinet'">
                      <div>
                        <div class="cart-item-spec">
                          <span>Тип управления:</span>
                          <span class="cart-item-spec-value" x-text="item.controlType === 'soft_start' ? 'Плавный пуск' : (item.controlType === 'frequency_converter' ? 'Преобразователь частоты' : 'Прямой пуск')"></span>
                        </div>
                        <div class="cart-item-spec">
                          <span>Мощность двигателя:</span>
                          <span class="cart-item-spec-value" x-text="item.motorPower + ' кВт'"></span>
                        </div>
                        <div x-show="item.controlType === 'direct_start'" class="cart-item-spec">
                          <span>Количество насосов:</span>
                          <span class="cart-item-spec-value" x-text="item.pumpCount"></span>
                        </div>
                      </div>
                    </template>
                    
                    <!-- Характеристики для реактивной мощности -->
                    <template x-if="item.commutationType === 'reactive_power'">
                      <div>
                        <div class="cart-item-spec">
                          <span>Тип регулирования:</span>
                          <span class="cart-item-spec-value" x-text="item.regulationType === 'unregulated' ? 'Нерегулируемая' : 'Автоматически регулируемая'"></span>
                        </div>
                        <div class="cart-item-spec">
                          <span>Мощность:</span>
                          <span class="cart-item-spec-value" x-text="item.reactivePower + ' кВАр'"></span>
                        </div>
                      </div>
                    </template>
                    
                    <!-- Характеристики для АВР -->
                    <template x-if="item.commutationType !== 'control_cabinet' && item.commutationType !== 'reactive_power'">
                      <div>
                        <div class="cart-item-spec">
                          <span>Тип коммутации:</span>
                          <span class="cart-item-spec-value" x-text="item.commutationType === 'monoblock' ? 'Моноблочный АВР' : (item.commutationType === 'single_phase_contactors' ? 'Однофазные контакторы' : 'Контакторы')"></span>
                        </div>
                        <div x-show="item.commutationType !== 'single_phase_contactors' && item.commutationType !== 'contactors'" class="cart-item-spec">
                          <span>Количество вводов:</span>
                          <span class="cart-item-spec-value" x-text="item.inputsCount"></span>
                        </div>
                        <div x-show="item.commutationType === 'contactors'" class="cart-item-spec">
                          <span>Количество полюсов:</span>
                          <span class="cart-item-spec-value" x-text="item.polesCount === 'single_phase' ? 'Однофазные' : 'Трёхфазные'"></span>
                        </div>
                        <div x-show="item.commutationType === 'single_phase_contactors'" class="cart-item-spec">
                          <span>Корпус:</span>
                          <span class="cart-item-spec-value" x-text="item.enclosureType === '19inch' ? '19 дюймов' : 'Навесной'"></span>
                        </div>
                        <div class="cart-item-spec">
                          <span>Подключение кабеля:</span>
                          <span class="cart-item-spec-value" x-text="item.commutationType === 'single_phase_contactors' ? (item.connectionType === 'poles' ? 'К полюсам автомата' : 'На дополнительные клеммы') : (item.cableConnection === 'poles' ? 'К полюсам автомата' : 'На дополнительные клеммы')"></span>
                        </div>
                        <div class="cart-item-spec">
                          <span>Климатическое исполнение:</span>
                          <span class="cart-item-spec-value" x-text="item.commutationType === 'single_phase_contactors' ? (item.climateType === 'UHL4' ? 'УХЛ4 - сухие теплые помещения' : 'У2 - уличное с обогревом') : (item.climateVersion === 'UXL4' ? 'УХЛ4 - сухие теплые помещения' : 'У2 - уличное с обогревом')"></span>
                        </div>
                      </div>
                    </template>
                  </div>

                  <div class="cart-item-actions">
                    <div class="cart-quantity-controls">
                      <!-- Количество -->
                      <div class="quantity-selector">
                        <button @click="changeQuantity(item, -1)" class="qty-btn qty-minus" :disabled="item.quantity <= 1">−</button>
                        <input type="number" 
                               x-model.number="item.quantity"
                               @change="saveQuantityChange(item)"
                               class="qty-display" 
                               min="1" 
                               max="999">
                        <button @click="changeQuantity(item, 1)" class="qty-btn qty-plus">+</button>
                      </div>
                      
                      <!-- Кнопка удаления -->
                      <button @click="confirmRemoveItem(item)" class="remove-btn">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                        Удалить
                      </button>
                    </div>

                    <!-- Цена -->
                    <div class="cart-item-price">
                      <div class="cart-item-total" x-text="formatPrice(item.totalPrice * item.quantity)"></div>
                      <div class="cart-item-unit-price" x-text="formatPrice(item.totalPrice) + ' за шт.'"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Итого -->
        <div class="cart-summary">
          <div class="cart-summary-row">
            <span class="cart-summary-items" x-text="'Товаров: ' + totalItems + ' шт.'"></span>
          </div>
          <div class="cart-summary-row cart-summary-total">
            <span>Итого:</span>
            <span x-text="formatPrice(totalPrice)"></span>
          </div>
          
          <div class="cart-actions">
            <button @click="confirmClearCart()" class="btn-clear-cart">
              Очистить корзину
            </button>
            <button @click="showCheckoutModal = true" class="btn-checkout">
              Оформить заказ
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Модальное окно оформления заказа -->
    <div x-show="showCheckoutModal" 
         x-cloak
         @click.self="showCheckoutModal = false"
         class="checkout-modal-overlay">
      <div class="checkout-modal" @click.stop>
        <button @click="showCheckoutModal = false" class="modal-close-btn">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>

        <h2 class="modal-title">Оформление заказа</h2>

        <!-- Выбор типа клиента -->
        <div class="client-type-selector">
          <button 
            @click="clientType = 'individual'" 
            :class="{'active': clientType === 'individual'}"
            class="client-type-btn">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span>Физическое лицо</span>
          </button>
          <button 
            @click="clientType = 'legal'" 
            :class="{'active': clientType === 'legal'}"
            class="client-type-btn">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            <span>Юридическое лицо</span>
          </button>
        </div>

        <!-- Форма для физического лица -->
        <form x-show="clientType === 'individual'" @submit.prevent="submitOrder" class="checkout-form">
          <div class="form-group">
            <label class="form-label">ФИО *</label>
            <input type="text" x-model="orderForm.fullName" required class="form-input" placeholder="Иванов Иван Иванович">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Телефон *</label>
              <input type="tel" x-model="orderForm.phone" required class="form-input" placeholder="+7 (___) ___-__-__">
            </div>
            <div class="form-group">
              <label class="form-label">Email *</label>
              <input type="email" x-model="orderForm.email" required class="form-input" placeholder="example@mail.ru">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Адрес доставки</label>
            <textarea x-model="orderForm.address" class="form-textarea" rows="2" placeholder="Укажите адрес доставки"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Комментарий к заказу</label>
            <textarea x-model="orderForm.comment" class="form-textarea" rows="3" placeholder="Дополнительная информация"></textarea>
          </div>

          <div class="form-actions">
            <button type="button" @click="showCheckoutModal = false" class="btn-cancel">Отмена</button>
            <button type="submit" class="btn-submit">Отправить заказ</button>

        </form>

        <!-- Форма для юридического лица -->
        <form x-show="clientType === 'legal'" @submit.prevent="submitOrder" class="checkout-form">
          <div class="form-group">
            <label class="form-label">Название организации *</label>
            <input type="text" x-model="orderForm.companyName" required class="form-input" placeholder="ООО «Компания»">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">ИНН *</label>
              <input type="text" x-model="orderForm.inn" required class="form-input" placeholder="1234567890">
            </div>
            <div class="form-group">
              <label class="form-label">КПП</label>
              <input type="text" x-model="orderForm.kpp" class="form-input" placeholder="123456789">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Юридический адрес *</label>
            <textarea x-model="orderForm.legalAddress" required class="form-textarea" rows="2" placeholder="Юридический адрес организации"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Контактное лицо *</label>
            <input type="text" x-model="orderForm.contactPerson" required class="form-input" placeholder="ФИО контактного лица">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Телефон *</label>
              <input type="tel" x-model="orderForm.phone" required class="form-input" placeholder="+7 (___) ___-__-__">
            </div>
            <div class="form-group">
              <label class="form-label">Email *</label>
              <input type="email" x-model="orderForm.email" required class="form-input" placeholder="example@mail.ru">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Комментарий к заказу</label>
            <textarea x-model="orderForm.comment" class="form-textarea" rows="3" placeholder="Дополнительная информация"></textarea>
          </div>

          <div class="form-actions">
            <button type="button" @click="showCheckoutModal = false" class="btn-cancel">Отмена</button>
            <button type="submit" class="btn-submit">Отправить заказ</button>
          </div>

  <script src="../js/cart.js"></script>
  <script src="../js/search.js"></script>
  <script>
    // Глобальная ссылка на данные корзины для использования в модальных окнах
    window.cartData = null;
    
    document.addEventListener('alpine:init', () => {
      Alpine.data('cartData', () => {
        const data = {
          items: [],
          totalItems: 0,
          totalPrice: 0,
          showCheckoutModal: false,
          clientType: 'individual', // 'individual' или 'legal'
          orderForm: {
            // Для физических лиц
            fullName: '',
            phone: '',
            email: '',
            address: '',
            comment: '',
            // Для юридических лиц
            companyName: '',
            inn: '',
            kpp: '',
            legalAddress: '',
            contactPerson: ''
          },

          init() {
            this.loadCart();
            
            // Слушаем изменения корзины
            window.addEventListener('cartChanged', (event) => {
              this.items = event.detail.items;
              this.totalItems = event.detail.totalItems;
              this.totalPrice = event.detail.totalPrice;
            });
          },

          loadCart() {
            if (window.cart) {
              this.items = window.cart.getItems();
              this.totalItems = window.cart.getTotalItems();
              this.totalPrice = window.cart.getTotalPrice();
            }
          },

          updateQuantity(itemId, quantity) {
            if (window.cart) {
              // Убеждаемся что количество корректное
              const validQuantity = Math.max(1, Math.min(999, parseInt(quantity) || 1));
              window.cart.updateQuantity(itemId, validQuantity);
              
              // Принудительно обновляем локальные данные
              this.loadCart();
            }
          },

          changeQuantity(item, delta) {
            const newQuantity = Math.max(1, item.quantity + delta);
            item.quantity = newQuantity;
            this.saveQuantityChange(item);
          },

          saveQuantityChange(item) {
            if (window.cart) {
              const validQuantity = Math.max(1, Math.min(999, parseInt(item.quantity) || 1));
              item.quantity = validQuantity;
              window.cart.updateQuantity(item.id, validQuantity);
              this.updateTotals();
            }
          },

          updateTotals() {
            this.totalItems = this.items.reduce((total, item) => total + item.quantity, 0);
            this.totalPrice = this.items.reduce((total, item) => total + (item.totalPrice * item.quantity), 0);
          },

          removeItem(itemId) {
            if (window.cart) {
              window.cart.removeItem(itemId);
            }
          },

          confirmRemoveItem(item) {
            this.showModal({
              type: 'warning',
              title: 'Удалить товар?',
              message: `Вы уверены, что хотите удалить "${item.productTitle}" из корзины?`,
              confirmText: 'Удалить',
              onConfirm: () => this.removeItem(item.id)
            });
          },

          clearCart() {
            if (window.cart) {
              window.cart.clear();
            }
          },

          confirmClearCart() {
            this.showModal({
              type: 'warning',
              title: 'Очистить корзину?',
              message: 'Вы уверены, что хотите удалить все товары из корзины? Это действие нельзя отменить.',
              confirmText: 'Очистить корзину',
              onConfirm: () => this.clearCart()
            });
          },

          // Универсальная система модальных окон (копия из main.js)
          showModal(options) {
            const {
              type = 'info',
              title = 'Подтверждение',
              message = '',
              showCancel = true,
              confirmText = 'Подтвердить',
              cancelText = 'Отмена',
              onConfirm = null,
              onCancel = null
            } = options;

            // Удаляем предыдущие модальные окна
            const existingModals = document.querySelectorAll('.universal-modal');
            existingModals.forEach(modal => modal.remove());

            // Создаем модальное окно
            const modal = document.createElement('div');
            modal.className = 'universal-modal modal-overlay show';
            
            const iconSvg = type === 'success' ? 
              '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' :
              type === 'warning' ?
              '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>' :
              '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

            modal.innerHTML = `
              <div class="modal-content">
                <div class="modal-header">
                  <div class="modal-icon modal-icon-${type}">
                    ${iconSvg}
                  </div>
                  <h3 class="modal-title">${title}</h3>
                </div>
                <div class="modal-message">${message}</div>
                <div class="modal-actions">
                  ${showCancel ? `<button class="modal-btn modal-btn-cancel">${cancelText}</button>` : ''}
                  <button class="modal-btn modal-btn-confirm">${confirmText}</button>
                </div>
              </div>
            `;

            // Добавляем обработчики событий
            const cancelBtn = modal.querySelector('.modal-btn-cancel');
            const confirmBtn = modal.querySelector('.modal-btn-confirm');

            if (cancelBtn) {
              cancelBtn.addEventListener('click', () => {
                modal.remove();
                if (onCancel && typeof onCancel === 'function') {
                  onCancel();
                }
              });
            }

            if (confirmBtn) {
              confirmBtn.addEventListener('click', () => {
                modal.remove();
                if (onConfirm && typeof onConfirm === 'function') {
                  onConfirm();
                }
              });
            }

            // Закрытие по клику вне окна
            modal.addEventListener('click', (e) => {
              if (e.target === modal) {
                modal.remove();
                if (onCancel && typeof onCancel === 'function') {
                  onCancel();
                }
              }
            });

            // Добавляем в body
            document.body.appendChild(modal);

            // Автоматически закрываем уведомления (не подтверждения) через 3 секунды
            if (!showCancel) {
              setTimeout(() => {
                if (modal.parentNode) {
                  modal.remove();
                }
              }, 3000);
            }
          },

          async submitOrder() {
            // Формируем данные заказа
            const orderData = {
              clientType: this.clientType === 'individual' ? 'Физическое лицо' : 'Юридическое лицо',
              orderDate: new Date().toLocaleString('ru-RU'),
              ...this.orderForm,
              totalItems: this.totalItems,
              totalPrice: this.formatPrice(this.totalPrice),
              // Форматируем товары для письма
              items: this.items.map((item, index) => 
                `${index + 1}. ${item.productTitle}\n` +
                `   Артикул: ${item.article}\n` +
                `   Производитель: ${item.manufacturerBrand}\n` +
                `   Количество: ${item.quantity} шт.\n` +
                `   Цена: ${this.formatPrice(item.totalPrice * item.quantity)}`
              ).join('\n\n')
            };

            try {
              // Отправляем через Formspree
              // ВАЖНО: Замените YOUR_FORM_ID на ваш ID после регистрации на formspree.io
              const response = await fetch('https://formspree.io/f/YOUR_FORM_ID', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(orderData)
              });

              if (response.ok) {
                // Показываем уведомление об успехе
                this.showModal({
                  type: 'success',
                  title: 'Заказ оформлен!',
                  message: 'Ваш заказ успешно отправлен. Мы свяжемся с вами в ближайшее время.',
                  showCancel: false,
                  confirmText: 'OK',
                  onConfirm: () => {
                    this.showCheckoutModal = false;
                    // Очищаем форму
                    this.orderForm = {
                      fullName: '',
                      phone: '',
                      email: '',
                      address: '',
                      comment: '',
                      companyName: '',
                      inn: '',
                      kpp: '',
                      legalAddress: '',
                      contactPerson: ''
                    };
                    // Очищаем корзину
                    this.clearCart();
                  }
                });
              } else {
                throw new Error('Ошибка отправки');
              }
            } catch (error) {
              console.error('Ошибка отправки заказа:', error);
              
              // Показываем ошибку
              this.showModal({
                type: 'warning',
                title: 'Ошибка',
                message: 'Не удалось отправить заказ. Проверьте подключение к интернету или свяжитесь с нами по телефону 8 (800) 55-11-052',
                showCancel: false,
                confirmText: 'OK'
              });
            }
          },

          formatPrice(price) {
            return new Intl.NumberFormat('ru-RU').format(price) + ' ₽';
          }
        };
        
        // Сохраняем глобальную ссылку для использования в модальных окнах
        window.cartData = data;
        return data;
      });
    });
  </script>
</body>
</html>
