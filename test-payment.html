<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тестирование платежей СБП</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    h1 {
      color: #F16664;
      margin-bottom: 0.5rem;
    }
    
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: #fef3c7;
      color: #92400e;
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    
    .section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: #f9fafb;
      border-radius: 8px;
    }
    
    h2 {
      color: #111827;
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }
    
    .btn {
      padding: 0.75rem 1.5rem;
      background: #F16664;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: #e74c3c;
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: #6b7280;
    }
    
    .btn-secondary:hover {
      background: #4b5563;
    }
    
    .output {
      margin-top: 1rem;
      padding: 1rem;
      background: #1f2937;
      color: #10b981;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    
    .output.error {
      color: #ef4444;
    }
    
    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e5e7eb;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #F16664;
    }
    
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #374151;
      font-weight: 600;
    }
    
    .qr-code {
      margin-top: 1rem;
      text-align: center;
    }
    
    .qr-code img {
      max-width: 300px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 1rem;
      background: white;
    }
    
    .info {
      padding: 1rem;
      background: #dbeafe;
      border-left: 4px solid #3b82f6;
      border-radius: 4px;
      margin-bottom: 1rem;
      color: #1e40af;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Тестирование платежей СБП</h1>
    <span class="badge">ТЕСТОВЫЙ РЕЖИМ</span>
    
    <div class="info">
      <strong>Инструкция:</strong> Создайте тестовый платеж, затем используйте кнопки для симуляции оплаты или отклонения.
    </div>
    
    <!-- Создание платежа -->
    <div class="section">
      <h2>1. Создать тестовый платеж</h2>
      
      <label>Тип клиента:</label>
      <select id="clientType">
        <option value="individual">Физическое лицо</option>
        <option value="legal">Юридическое лицо</option>
      </select>
      
      <label>ФИО / Название организации:</label>
      <input type="text" id="fullName" value="Тест Тестов" placeholder="Введите имя">
      
      <label>Телефон:</label>
      <input type="text" id="phone" value="+7 (999) 123-45-67" placeholder="+7 (999) 123-45-67">
      
      <label>Email:</label>
      <input type="email" id="email" value="test@example.com" placeholder="test@example.com">
      
      <label>Сумма заказа (₽):</label>
      <input type="number" id="amount" value="1000" placeholder="1000">
      
      <button class="btn" onclick="createPayment()">Создать платеж</button>
      
      <div id="createOutput" class="output" style="display: none;"></div>
      <div id="qrCode" class="qr-code"></div>
    </div>
    
    <!-- Проверка статуса -->
    <div class="section">
      <h2>2. Проверить статус платежа</h2>
      
      <label>Payment ID:</label>
      <input type="text" id="paymentId" placeholder="pm_test_...">
      
      <button class="btn btn-secondary" onclick="checkStatus()">Проверить статус</button>
      
      <div id="statusOutput" class="output" style="display: none;"></div>
    </div>
    
    <!-- Симуляция оплаты -->
    <div class="section">
      <h2>3. Симулировать оплату</h2>
      
      <button class="btn" onclick="mockPaySuccess()">✅ Успешная оплата</button>
      <button class="btn btn-secondary" onclick="mockPayFail()">❌ Отклонить платеж</button>
      
      <div id="mockOutput" class="output" style="display: none;"></div>
    </div>
    
    <!-- Список платежей -->
    <div class="section">
      <h2>4. Список всех тестовых платежей</h2>
      
      <button class="btn btn-secondary" onclick="listPayments()">Показать список</button>
      
      <div id="listOutput" class="output" style="display: none;"></div>
    </div>
  </div>
  
  <script>
    const API_URL = 'http://localhost:3000';
    let currentPaymentId = null;
    
    async function createPayment() {
      const output = document.getElementById('createOutput');
      const qrDiv = document.getElementById('qrCode');
      output.style.display = 'block';
      output.className = 'output';
      output.textContent = 'Создание платежа...';
      qrDiv.innerHTML = '';
      
      try {
        const clientType = document.getElementById('clientType').value;
        const fullName = document.getElementById('fullName').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const amount = parseInt(document.getElementById('amount').value);
        
        const orderData = {
          clientType: clientType,
          clientInfo: {
            fullName: fullName,
            phone: phone,
            email: email,
            address: 'Тестовый адрес',
            comment: 'Тестовый заказ'
          },
          items: [{
            id: 'test-1',
            article: 'TEST-001',
            productTitle: 'Тестовый товар',
            manufacturerBrand: 'Test Brand',
            quantity: 1,
            unitPrice: amount,
            totalPrice: amount
          }],
          totalItems: 1,
          totalPrice: amount
        };
        
        const response = await fetch(`${API_URL}/api/payments/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderData })
        });
        
        const data = await response.json();
        
        if (data.success) {
          currentPaymentId = data.paymentId;
          document.getElementById('paymentId').value = currentPaymentId;
          
          output.textContent = JSON.stringify(data, null, 2);
          
          // Показываем QR-код
          if (data.qrCode && data.qrCode.image) {
            qrDiv.innerHTML = `
              <h3>QR-код для оплаты:</h3>
              <img src="${data.qrCode.image}" alt="QR-код">
              <p style="margin-top: 1rem; color: #6b7280;">
                Payment ID: <strong>${data.paymentId}</strong>
              </p>
            `;
          }
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        output.className = 'output error';
        output.textContent = 'Ошибка: ' + error.message;
      }
    }
    
    async function checkStatus() {
      const output = document.getElementById('statusOutput');
      const paymentId = document.getElementById('paymentId').value;
      
      if (!paymentId) {
        alert('Введите Payment ID');
        return;
      }
      
      output.style.display = 'block';
      output.className = 'output';
      output.textContent = 'Проверка статуса...';
      
      try {
        const response = await fetch(`${API_URL}/api/payments/status/${paymentId}`);
        const data = await response.json();
        
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.className = 'output error';
        output.textContent = 'Ошибка: ' + error.message;
      }
    }
    
    async function mockPaySuccess() {
      const output = document.getElementById('mockOutput');
      const paymentId = document.getElementById('paymentId').value;
      
      if (!paymentId) {
        alert('Введите Payment ID');
        return;
      }
      
      output.style.display = 'block';
      output.className = 'output';
      output.textContent = 'Симуляция успешной оплаты...';
      
      try {
        const response = await fetch(`${API_URL}/api/payments/mock-pay/${paymentId}`, {
          method: 'POST'
        });
        const data = await response.json();
        
        output.textContent = JSON.stringify(data, null, 2);
        
        // Автоматически проверяем статус
        setTimeout(checkStatus, 1000);
      } catch (error) {
        output.className = 'output error';
        output.textContent = 'Ошибка: ' + error.message;
      }
    }
    
    async function mockPayFail() {
      const output = document.getElementById('mockOutput');
      const paymentId = document.getElementById('paymentId').value;
      
      if (!paymentId) {
        alert('Введите Payment ID');
        return;
      }
      
      output.style.display = 'block';
      output.className = 'output';
      output.textContent = 'Симуляция отклонения платежа...';
      
      try {
        const response = await fetch(`${API_URL}/api/payments/mock-fail/${paymentId}`, {
          method: 'POST'
        });
        const data = await response.json();
        
        output.textContent = JSON.stringify(data, null, 2);
        
        // Автоматически проверяем статус
        setTimeout(checkStatus, 1000);
      } catch (error) {
        output.className = 'output error';
        output.textContent = 'Ошибка: ' + error.message;
      }
    }
    
    async function listPayments() {
      const output = document.getElementById('listOutput');
      output.style.display = 'block';
      output.className = 'output';
      output.textContent = 'Загрузка списка...';
      
      try {
        const response = await fetch(`${API_URL}/api/payments/mock-list`);
        const data = await response.json();
        
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.className = 'output error';
        output.textContent = 'Ошибка: ' + error.message;
      }
    }
  </script>
</body>
</html>
