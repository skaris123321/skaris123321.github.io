<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест шкафов управления с преобразователем частоты</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .product { border: 1px solid #ccc; margin: 10px; padding: 10px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Тест шкафов управления с преобразователем частоты</h1>
    <div id="status">Загрузка...</div>
    <div id="results"></div>

    <script>
        async function testFrequencyConverters() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            try {
                statusDiv.innerHTML = 'Загружаем данные...';
                
                const response = await fetch('./data/products.json');
                if (!response.ok) throw new Error('Failed to load products');
                
                const data = await response.json();
                
                // Фильтруем шкафы управления
                const controlCabinets = data.products.filter(product => 
                    product.commutation_type === 'control_cabinet'
                );
                
                // Фильтруем преобразователи частоты
                const frequencyConverters = controlCabinets.filter(product => 
                    product.control_type === 'frequency_converter'
                );
                
                statusDiv.innerHTML = `
                    <div class="success">
                        Всего товаров: ${data.products.length}<br>
                        Шкафов управления: ${controlCabinets.length}<br>
                        Преобразователей частоты: ${frequencyConverters.length}
                    </div>
                `;
                
                // Группируем по мощности
                const powerGroups = {};
                frequencyConverters.forEach(product => {
                    const power = product.motor_power;
                    if (!powerGroups[power]) {
                        powerGroups[power] = [];
                    }
                    powerGroups[power].push(product);
                });
                
                // Сортируем мощности
                const sortedPowers = Object.keys(powerGroups).sort((a, b) => parseFloat(a) - parseFloat(b));
                
                let html = '<h2>Преобразователи частоты по мощностям:</h2>';
                sortedPowers.forEach(power => {
                    const products = powerGroups[power];
                    html += `<h3>${power} кВт (${products.length} товаров)</h3>`;
                    
                    products.forEach(product => {
                        html += `
                            <div class="product">
                                <strong>ID:</strong> ${product.id}<br>
                                <strong>Артикул:</strong> ${product.article}<br>
                                <strong>Бренд:</strong> ${product.brand}<br>
                                <strong>Мощность:</strong> ${product.motor_power} кВт<br>
                                <strong>Цена:</strong> ${product.base_price} ₽<br>
                                <strong>Изображение:</strong> ${product.main_image || 'Нет'}
                            </div>
                        `;
                    });
                });
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                statusDiv.innerHTML = `<div class="error">Ошибка: ${error.message}</div>`;
                console.error('Error:', error);
            }
        }
        
        testFrequencyConverters();
    </script>
</body>
</html>
